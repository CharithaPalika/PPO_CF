# PPO-CF experiment on MiniGrid-BlockedUnlockPickup-v0.
#
# ONE config drives the comparison arms. The notebook overrides only
# `ppo.pg_mode` (gae / cf_all_action / cf_shuffled), so every other
# hyperparameter is identical by construction.
#
# This uses the same PPO base as blockedunlockpickup.yaml and adds a direct
# all-action counterfactual branch estimator. H=96 is a conservative first
# horizon because reward sits after several prerequisites: clear blocker,
# acquire key, unlock door, reach object, free carrying slot if needed, pickup.
# The 3% state subsample keeps the branch budget close to the UnlockPickup
# config's H=64, subsample=5% cost.

env:
  env_id: MiniGrid-BlockedUnlockPickup-v0
  n_envs: 16
  max_episode_steps: null
  obs_norm: image
  fully_observable: true
  success_on: terminated
  layout_seeds: [0]
  layout_seed_mode: cycle

ppo:
  total_timesteps: 2000000
  n_steps: 128
  n_epochs: 4
  n_minibatches: 8
  learning_rate: 0.001
  anneal_lr: false
  optim_eps: 1.0e-8
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.1
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

  norm_adv: batch
  norm_adv_min_std: 1.0e-06

  pg_mode: cf_all_action
  cf_restore: fast
  cf_validate: true
  alpha_gae: 1.0
  alpha_cf: 0.5
  cf_horizon: 96
  cf_rollouts: 2
  cf_subsample: 0.03
  cf_bootstrap_tail: true
  cf_branch_envs: 256

  ent_mode: fixed
  prob_floor_start: 0.20
  prob_floor_end: 0.05

  encoder: cnn
  share_encoder: true
  hidden_sizes: [64]
  activation: tanh
  separate_grad_clip: false
  device: cpu

run:
  run_name: blockedunlockpickup_fixed0_floor
  seeds: [0]
  trajectory_stride: 4
  compact_trajectory_dtypes: true
  log_every_updates: 10
  record_trajectories: true
  eval_every_updates: 0
  eval_episodes: 20
  init_from: null

reward:
  potential_shaping: false
  potential_key: 0.0
  potential_door: 0.0
  count_bonus_coef: 0.0

oracle:
  checkpoint_fraction: 0.75

note: |
  If `cf_reward_coverage` stays near zero, prefer reducing subsample further
  and increasing horizon before changing PPO hyperparameters. A branch that
  never reaches reward cannot distinguish the actions that matter in this task.

