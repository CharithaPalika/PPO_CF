# PPO-CF experiment, rung 2: MiniGrid-DoorKey-6x6-v0.
#
# ONE config drives BOTH arms of the comparison. The notebook builds the
# control arm by overriding `ppo.pg_mode: gae` and the treatment arm with
# `ppo.pg_mode: cf_all_action`, so every other hyperparameter is identical by
# construction and the only difference between the runs is the policy gradient.
#
# NO WARM START, deliberately, unlike the plain-PPO 6x6 config. A controlled
# CF-vs-GAE comparison must not start from a policy trained under a different
# policy gradient -- both arms begin from scratch, so the only difference
# between them is the gradient itself.
#
# Plain PPO WITH a warm start needed 1.13M frames here. From scratch, 750k will
# very likely leave both arms unsolved, and that is fine: the metric becomes
# progress at a fixed budget (door rate and success rate at 750k), which is a
# legitimate comparison and a far more discriminating one than 5x5, where
# baseline PPO already wins easily.
#
# Runtime: control ~7 min/seed; CF ~57 min/seed at cf_restore=exact. Consider
# cf_restore: fast (verified equivalent in the notebook) and 2 seeds here.

env:
  env_id: MiniGrid-DoorKey-6x6-v0
  n_envs: 16
  max_episode_steps: null
  obs_norm: image
  fully_observable: true       # the oracle needs an MDP; do not change
  layout_seeds: null
  layout_seed_mode: cycle

ppo:
  total_timesteps: 750000
  n_steps: 128
  n_epochs: 4
  n_minibatches: 8
  learning_rate: 0.001
  anneal_lr: false
  optim_eps: 1.0e-8
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

  norm_adv: batch
  norm_adv_min_std: 1.0e-06

  pg_mode: cf_all_action       # the notebook overrides this per arm
  cf_restore: fast             # verified bit-identical to 'exact' by notebook 02
  cf_validate: true

  # --- Eq (3) rollout estimator + Eq (6) blend -------------------------- #
  # Q_g(s,a) is the discounted RETURN after forcing a then following pi --
  # NOT the one-step r + gamma*V(s'). That substitution was the original bug:
  # DoorKey's reward is purely terminal, so the one-step form contained reward
  # in only 0.54% of states and correlated +0.098 with the GAE advantage. The
  # rollout form raises reward coverage ~8-20x. Measured on a partly-trained
  # 5x5 policy (K=7, R=2):
  #     H= 8   coverage 0.041   16 ms/state
  #     H=16   coverage 0.098   28 ms/state
  #     H=32   coverage 0.206   53 ms/state
  # `cf_reward_coverage` is logged every update -- if it sits near zero the
  # estimator has degenerated back to a critic difference and no tuning helps.
  alpha_gae: 0.5               # L_actor = alpha_gae*L_PPO + alpha_cf*L_CF
  alpha_cf: 0.5                # 0.5/0.5 == the plan's Eq (6) alpha = 0.5
  cf_horizon: 16
  cf_rollouts: 2               # common random numbers across actions
  cf_subsample: 0.10           # ~205 of 2048 states per rollout; cost-forced
  cf_bootstrap_tail: true
  cf_branch_envs: 256

  ent_mode: fixed
  prob_floor_start: 0.0
  prob_floor_end: 0.0

  encoder: cnn
  share_encoder: true
  hidden_sizes: [64]
  activation: tanh
  separate_grad_clip: false
  device: cpu

run:
  run_name: dk6x6            # the notebook appends _gae / _cf
  seeds: [0, 1]
  trajectory_stride: 4
  compact_trajectory_dtypes: true
  log_every_updates: 10
  record_trajectories: true
  eval_every_updates: 0
  eval_episodes: 20
  # WARM START. Points at the plain-PPO curriculum's previous rung. Both arms
  # of the comparison are built from THIS config with only `ppo.pg_mode`
  # overridden, so the control and the treatment start from the SAME weights --
  # which is what plan rule 4 ("identical initialization ... across paired
  # arms") requires. Warm-starting only one arm would invalidate the comparison.
  #
  # Deliberately seed_0 rather than seed_{seed}: the plain curriculum has only
  # been run at seed 0. Every seed of both arms therefore starts from one
  # identical policy, so seeds differ only in environment and sampling streams.
  # If you later run the plain curriculum at more seeds, change this to
  # `seed_{seed}` to restore per-seed initialisation diversity.
  init_from: runs/doorkey5x5/seed_0/checkpoints/ckpt_100.pt

reward:
  # Must stay off. The oracle computes Q_CF from the RAW environment reward; if
  # the critic were trained on a shaped one, A_CF would mix two different
  # reward functions. config._validate refuses the combination.
  potential_shaping: false
  count_bonus_coef: 0.0

oracle:
  checkpoint_fraction: 0.75

note: |
  The critic is still trained on GAE returns in both arms -- only the POLICY
  loss changes. That keeps V a value function for pi, which is what Q_CF
  bootstraps through, and keeps the value-side diagnostics comparable.
