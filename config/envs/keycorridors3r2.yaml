# MiniGrid-KeyCorridorS3R2-v0 -- plain PPO baseline.
#
# WEB CHECK (2026-09-12). RL Baselines3 Zoo has a specific PPO entry for
# MiniGrid-KeyCorridorS3R1-v0: 500k timesteps, n_envs 8, n_steps 128,
# minibatch 64, n_epochs 10, gamma 0.99, gae_lambda 0.95, learning_rate 2.5e-4,
# clip 0.2, ent_coef 0.0, with the public MiniGrid defaults inherited from
# rl-starter-files. Zoo does not list a separate S3R2 row, so this config keeps
# those tuned PPO values and doubles the frame budget for the harder two-row
# corridor. The working local recipe fixes one layout and keeps a small action
# floor/entropy guard; those values are now the YAML source of truth so notebooks
# and CLI runs do not need ad hoc overrides.
#
# WHY NOT COPY THE WRAPPER LITERALLY.
#   zoo:  FlatObsWrapper + MlpPolicy over MiniGrid's egocentric observation
#   here: FullyObsWrapper + image CNN, so the later PPO-CF oracle gets a Markov
#         state and exact simulator restore remains meaningful.

env:
  env_id: MiniGrid-KeyCorridorS3R2-v0
  n_envs: 8
  max_episode_steps: null
  obs_norm: image
  fully_observable: true
  success_on: terminated
  layout_seeds: [0]
  layout_seed_mode: cycle

ppo:
  total_timesteps: 500000
  n_steps: 128
  n_epochs: 10
  n_minibatches: 16
  learning_rate: 0.00025
  anneal_lr: false
  optim_eps: 1.0e-8
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.03
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

  norm_adv: batch
  norm_adv_min_std: 1.0e-06

  pg_mode: gae
  ent_mode: fixed
  prob_floor_start: 0.15
  prob_floor_end: 0.02

  encoder: cnn
  share_encoder: true
  hidden_sizes: [64]
  activation: tanh
  separate_grad_clip: false
  device: cpu

run:
  run_name: keycorridors3r2
  seeds: [0]
  trajectory_stride: 4
  compact_trajectory_dtypes: true
  log_every_updates: 10
  record_trajectories: true
  eval_every_updates: 0
  eval_episodes: 20
  init_from: null

reward:
  potential_shaping: false
  potential_key: 0.0
  potential_door: 0.0
  count_bonus_coef: 0.0

oracle:
  checkpoint_fraction: 0.75

note: |
  Actions are 0 left, 1 right, 2 forward, 3 pickup, 4 drop, 5 toggle, 6 done.
  This is the fixed-layout/floor recipe that worked locally. Once it is stable,
  use overrides to try a small layout pool, then random layouts.
