# MiniGrid-KeyCorridorS3R3-v0 -- plain PPO baseline.
#
# Next rung after KeyCorridorS3R2. Farama registers this as the same task family
# with one more corridor row: find the key, unlock the target door, and pick up
# the object. This keeps the action-dependent mechanism from S3R2 while
# increasing exploration depth without jumping to the much harder blocked
# UnlockPickup chain.
#
# Hyperparameter source:
#   - RL Baselines3 Zoo's tuned KeyCorridorS3R1 PPO shape:
#     n_envs 8, n_steps 128, minibatch 64, n_epochs 10, gamma 0.99,
#     gae_lambda 0.95, learning_rate 2.5e-4, clip 0.2.
#   - The working local recipe fixes layout seed 0, uses lr=5e-4, and keeps a
#     stronger entropy/floor guard. These values are now the YAML source of
#     truth so notebooks do not need ad hoc overrides.

env:
  env_id: MiniGrid-KeyCorridorS3R3-v0
  n_envs: 8
  max_episode_steps: null
  obs_norm: image
  fully_observable: true
  success_on: terminated
  layout_seeds: [0]
  layout_seed_mode: cycle

ppo:
  total_timesteps: 1000000
  n_steps: 128
  n_epochs: 10
  n_minibatches: 16
  learning_rate: 0.0005
  anneal_lr: false
  optim_eps: 1.0e-8
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.1
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

  norm_adv: batch
  norm_adv_min_std: 1.0e-06

  pg_mode: gae
  ent_mode: fixed
  prob_floor_start: 0.03
  prob_floor_end: 0.001

  encoder: cnn
  share_encoder: true
  hidden_sizes: [64]
  activation: tanh
  separate_grad_clip: false
  device: cpu

run:
  run_name: keycorridors3r3_fixed0_lr5e4
  seeds: [0]
  trajectory_stride: 4
  compact_trajectory_dtypes: true
  log_every_updates: 10
  record_trajectories: true
  eval_every_updates: 0
  eval_episodes: 20
  init_from: null

reward:
  potential_shaping: false
  potential_key: 0.0
  potential_door: 0.0
  count_bonus_coef: 0.0

oracle:
  checkpoint_fraction: 0.75

note: |
  Actions are 0 left, 1 right, 2 forward, 3 pickup, 4 drop, 5 toggle, 6 done.
  This is the fixed-layout lr=5e-4 recipe that worked locally. Once fixed
  layout learns, rerun with `env.layout_seeds: [0, 1, 2, 3]`, then
  `env.layout_seeds: null`.
