# PPO-CF experiment on MountainCar-v0.
#
# ONE config drives ALL THREE arms. The notebook overrides only `ppo.pg_mode`
# (gae / cf_all_action / cf_shuffled), so every other hyperparameter is
# identical by construction and the only difference between runs is the policy
# gradient.
#
# MountainCar is useful as a pipeline check, not as the strongest scientific
# case for PPO-CF. The hard part is exploration: before the first goal reach,
# every step pays -1 and the critic tends toward the constant value -1/(1-gamma).
# A one-step counterfactual landscape is then nearly flat during exactly the
# phase where exploration matters. The online PPO-CF path uses the rollout
# estimator Q_g, so it is less degenerate than the historical one-step NB02
# oracle, but it should still be read as a sanity check before MiniGrid.
#
# Keep the PPO settings matched to mountaincar.yaml. The comparison is only
# meaningful if the arms differ in `ppo.pg_mode` and the CF-only fields.

env:
  env_id: MountainCar-v0
  n_envs: 16
  max_episode_steps: 500       # exploration knob; evaluated at the standard 200
  obs_norm: fixed
  layout_seeds: null

ppo:
  total_timesteps: 400000
  n_steps: 32
  n_epochs: 4
  n_minibatches: 4
  learning_rate: 0.0007
  anneal_lr: true
  optim_eps: 1.0e-05
  gamma: 0.99
  gae_lambda: 0.98
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.1 #0.003
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

  norm_adv: minibatch          # match the passed MountainCar Gate-1 runs
  norm_adv_min_std: 1.0e-06

  pg_mode: cf_all_action       # the notebook overrides this per arm
  cf_restore: exact            # fast restore is MiniGrid-only
  cf_validate: true
  alpha_gae: 1.0
  alpha_cf: 0.5
  cf_horizon: 32
  cf_rollouts: 2
  cf_subsample: 0.10           # about 51 of 512 rollout states per update
  cf_bootstrap_tail: true
  cf_branch_envs: 256

  ent_mode: adaptive
  target_entropy_frac_start: 0.55
  target_entropy_frac_end: 0.02
  ent_anneal_full_rate: 0.80
  prob_floor_start: 0.0
  prob_floor_end: 0.0

  encoder: mlp
  share_encoder: false
  hidden_sizes: [64, 64]
  activation: tanh
  separate_grad_clip: true
  device: cpu

run:
  run_name: mountaincar
  seeds: [0, 1, 2]
  trajectory_stride: 1
  compact_trajectory_dtypes: false
  log_every_updates: 10
  record_trajectories: true
  eval_every_updates: 0
  eval_episodes: 20
  init_from: null

reward:
  potential_shaping: false
  count_bonus_coef: 0.0

oracle:
  checkpoint_fraction: 0.75

note: |
  Actions are 0 push left, 1 no push, 2 push right. A useful learned policy
  pumps energy by pushing with the velocity, not by greedily pushing right.

  Evaluate learned checkpoints at the standard 200-step limit. Training uses
  500 steps only to make first reward discovery reachable.
