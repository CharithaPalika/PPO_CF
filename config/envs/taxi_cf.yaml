# PPO-CF experiment on Taxi-v4.
#
# ONE config drives ALL THREE arms. The notebook overrides only `ppo.pg_mode`
# (gae / cf_all_action / cf_shuffled), so every other hyperparameter is
# identical by construction and the only difference between runs is the policy
# gradient.
#
# Taxi's useful failure mode is policy collapse away from PICKUP/DROPOFF. The
# baseline config uses a probability floor because entropy alone can stay high
# while those two mandatory actions vanish. Keep those defenses here so the CF
# comparison measures the gradient estimator rather than a known exploration
# pathology.

env:
  env_id: Taxi-v4
  n_envs: 16
  max_episode_steps: 200
  obs_norm: onehot
  layout_seeds: null

ppo:
  total_timesteps: 1000000
  n_steps: 64
  n_epochs: 4
  n_minibatches: 4
  learning_rate: 0.0007
  anneal_lr: true
  optim_eps: 1.0e-05
  gamma: 0.99
  gae_lambda: 0.98
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.003
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

  norm_adv: minibatch
  norm_adv_min_std: 1.0e-06

  pg_mode: cf_all_action       # the notebook overrides this per arm
  cf_restore: exact            # fast restore is MiniGrid-only
  cf_validate: true
  alpha_gae: 1.0
  alpha_cf: 0.5
  cf_horizon: 32
  cf_rollouts: 2
  cf_subsample: 0.10           # about 102 of 1024 rollout states per update
  cf_bootstrap_tail: true
  cf_branch_envs: 256

  ent_mode: adaptive
  target_entropy_frac_start: 0.90
  target_entropy_frac_end: 0.02
  ent_anneal_full_rate: 0.80
  prob_floor_start: 0.20
  prob_floor_end: 0.01

  encoder: mlp
  share_encoder: false
  hidden_sizes: [64, 64]
  activation: tanh
  separate_grad_clip: true
  device: cpu

run:
  run_name: taxi
  seeds: [0]
  trajectory_stride: 1
  compact_trajectory_dtypes: true
  log_every_updates: 10
  record_trajectories: true
  eval_every_updates: 0
  eval_episodes: 20
  init_from: null

reward:
  potential_shaping: false
  count_bonus_coef: 0.0

oracle:
  checkpoint_fraction: 0.75

note: |
  Actions are 0 south, 1 north, 2 east, 3 west, 4 pickup, 5 dropoff. A solved
  episode terminates after the passenger is dropped at the target, so the
  default `success_on: terminated` semantics are correct for Taxi.

  The counterfactual horizon is intentionally moderate. Illegal pickup/dropoff
  penalties are visible immediately, while successful delivery can still enter
  Q_g through 32-step branches once trajectories are close enough to the goal.
