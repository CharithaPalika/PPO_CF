# PPO-CF experiment on MiniGrid-Unlock-v0.
#
# ONE config drives ALL THREE arms. The notebook overrides only `ppo.pg_mode`
# (gae / cf_all_action / cf_shuffled), so every other hyperparameter is
# identical by construction and the only difference between runs is the policy
# gradient. Plan rule 4 requires exactly that.
#
# WHY UNLOCK IS THE BEST-POSED CF TASK IN THIS PROJECT SO FAR.
# The DoorKey curriculum measured P(solve | door open) ~ 1.00 and
# P(door | key) 0.65-0.87: the single lossy leg is key -> door. Unlock IS that
# leg with nothing attached -- opening the door ends the episode. And unlike
# DoorKey and RedBlueDoors, the reward is actually reachable inside a branch.
#
# CF_HORIZON, MEASURED (2026-09-09) on the trained baseline
# runs/unlock/seed_0/checkpoints/ckpt_075.pt, 120 states, K=7, R=2:
#
#     H    branch cov   states w/ reward   term<H   mean|A_CF|   corr(A_CF,GAE)   ms/state
#     8       0.034          0.075          0.034     0.0361        +0.150          17.4
#    16       0.093          0.308          0.093     0.0506        +0.084          29.7
#    32       0.210          0.625          0.210     0.0732        -0.038          59.2   <- here
#    64       0.434          0.925          0.434     0.1147        -0.156          95.9
#
# Compare the same sweep on RedBlueDoors-6x6 (see that config): H=16 gave 0.000,
# H=32 gave 0.002, H=64 gave 0.015. Unlock at H=32 has roughly a HUNDRED TIMES
# the coverage RedBlueDoors had at the same horizon. `cf_reward_coverage` near
# zero is the failure mode that has dogged every previous CF run; it does not
# happen here.
#
# READ THE CORRELATION COLUMN WITH CARE. With 120 states the standard error on
# a correlation is ~1/sqrt(120) = 0.09, so H=8, 16 and 32 are not distinguishable
# from each other or from zero. Only H=64's -0.156 is plausibly real, and it is
# NEGATIVE. Coverage, by contrast, is a mean over 1,680 branches and is measured
# precisely. So H is chosen on coverage, and the correlation is something to
# watch during training (`cf_corr_gae` is logged every update), not something
# these numbers can settle.
#
# COST. Branch budget is H * cf_rollouts * cf_subsample.
#   H=32, subsample 0.05 -> budget 3.20, 102 states/rollout, ~6.0 s/update
#   H=16, subsample 0.10 -> budget 3.20, 205 states/rollout, ~6.1 s/update
# Identical cost; H=32 buys 2.3x the coverage per labelled state. "Fewer states
# with real coverage beats more states with none" -- the same trade the
# RedBlueDoors-6x6 config makes. At 244 updates that is ~25 min/seed against
# ~5 min for the gae arm.

env:
  env_id: MiniGrid-Unlock-v0
  n_envs: 16
  max_episode_steps: null      # MiniGrid's own limit: 288
  obs_norm: image
  fully_observable: true       # the oracle needs an MDP; do not change
  success_on: terminated       # measured: 0 of 400 random episodes end with reward <= 0
  layout_seeds: null
  layout_seed_mode: cycle

ppo:
  total_timesteps: 500000      # the budget the baseline solved in (90% at 348k)
  n_steps: 128
  n_epochs: 4
  n_minibatches: 8             # -> minibatch 256
  learning_rate: 0.001
  anneal_lr: false
  optim_eps: 1.0e-8
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

  norm_adv: batch
  norm_adv_min_std: 1.0e-06

  pg_mode: cf_all_action       # the notebook overrides this per arm
  cf_restore: fast             # verify section 3 checks this against 'exact'
  cf_validate: true
  # L_actor = alpha_gae*L_PPO + alpha_cf*L_CF.
  # NOT the plan's convex 0.5/0.5. Because sum_a pi_old(a|s) A_CF(s,a) = 0
  # exactly, the CF term is zero-mean under the behaviour policy: at
  # theta = theta_old it cannot bias the gradient, only its variance. So it goes
  # in as a CONTROL VARIATE on top of a full-strength PPO gradient rather than
  # replacing half of one. Drop alpha_cf to 0.1 if approx_kl runs hot -- note
  # that alpha_gae + alpha_cf = 1.5 takes larger actor steps than the gae arm's
  # 1.0, which is a step-size confound to watch across arms.
  alpha_gae: 1.0
  alpha_cf: 0.5
  cf_horizon: 32               # measured; see the table above
  cf_rollouts: 2               # common random numbers across actions
  cf_subsample: 0.05           # 102 of 2048 states per rollout; budget 3.20
  cf_bootstrap_tail: true
  cf_branch_envs: 256

  ent_mode: fixed
  prob_floor_start: 0.0
  prob_floor_end: 0.0

  encoder: cnn
  share_encoder: true
  hidden_sizes: [64]
  activation: tanh
  separate_grad_clip: false
  device: cpu

run:
  run_name: unlock            # the notebook appends _gae / _cf / _shuf
  seeds: [0, 1]
  trajectory_stride: 4
  compact_trajectory_dtypes: true
  log_every_updates: 10
  record_trajectories: true
  eval_every_updates: 0
  eval_episodes: 20
  init_from: null              # nothing below this env to warm-start from

reward:
  # Must stay off: config._validate refuses shaping together with
  # pg_mode=cf_all_action, because the oracle reads the RAW environment reward
  # while the critic would have been trained on the shaped one.
  potential_shaping: false
  potential_key: 0.0
  potential_door: 0.0
  count_bonus_coef: 0.0

oracle:
  checkpoint_fraction: 0.75

note: |
  7 actions. `pickup` (3) lifts the key and `toggle` (5) opens the door -- both
  rungs of the task, both must stay alive in the per-action panel. `drop` (4)
  and `done` (6) are useless, so a correct oracle should rank them below average
  almost everywhere; landscape_summary checks that.

  The sub-goal probe runs in key_door mode (the grid has a key), so
  subgoal1 = carrying the key and subgoal2 = door open. On THIS env subgoal2 and
  success are the same event, so those two curves will coincide. The gap that
  carries information is subgoal1 -> subgoal2.
